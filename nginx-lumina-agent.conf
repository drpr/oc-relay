# lumina-agent site — upstream copy plus the ACME challenge location required
# by the OpenCode relay's Let's Encrypt IP certificate.
#
# Only the ACME location block is new; everything else is the site's original
# configuration, kept here so the change is reviewable and re-appliable.

server {
    listen 80;
    server_name _;

    root /home/ubuntu/universal-agent/frontend/dist;
    index index.html;

    # ACME HTTP-01 for the Let's Encrypt IP certificate (SAN=IP:43.135.23.149).
    #
    # certbot's webroot plugin validates against the IP itself, so the
    # challenge lands on this very server block. Without an explicit
    # location the request would fall through to the SPA fallback and be
    # answered with index.html, which broke issuance with
    # "reader size limit exceeded".
    #
    # `^~` makes this prefix win over the `location /` SPA fallback, and
    # `try_files` keeps a missing challenge a 404 instead of serving the SPA.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    # APK 下载路由
    location /apk {
        alias /var/www/downloads/WastelandCavalry.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=WastelandCavalry.apk";
    }

    location /downloads/ {
        alias /var/www/downloads/;
        autoindex on;
        types {
            application/vnd.android.package-archive apk;
        }
        add_header Content-Disposition "attachment";
    }

    # Proxy all /api requests to the FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
